<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battery Job Daily — 배터리 취업공고를 매일 한곳에서</title>
<meta name="description" content="배터리 셀·소재·분석장비·리사이클링 기업의 채용공고를 매일 수집해 직무 카테고리와 적합도로 정리합니다." />
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>

<header class="masthead">
  <div class="wrap">
    <div class="masthead__row">
      <div class="brand">
        <h1 class="brand__name"><span class="brand__mark" aria-hidden="true"></span>Battery Job Daily</h1>
        <p class="brand__tag">배터리 취업공고를 매일 한곳에서</p>
      </div>
      <div class="masthead__tools">
        <div class="datenav">
          <button class="iconbtn" id="prevDay" aria-label="이전 날짜">‹</button>
          <input type="date" id="datePick" aria-label="공고 등록 날짜 선택" />
          <button class="iconbtn" id="nextDay" aria-label="다음 날짜">›</button>
        </div>
        <button class="btn" id="todayBtn">오늘</button>
        <button class="btn" id="settingsBtn">내 프로필</button>
        <button class="iconbtn" id="themeBtn" aria-label="라이트·다크 모드 전환">◐</button>
      </div>
    </div>
    <div class="statusbar" id="statusbar" aria-live="polite"></div>
  </div>
</header>

<main id="main" class="wrap">
  <div id="banners"></div>

  <section class="section" id="picksSection">
    <div class="section__head">
      <h2 class="section__title">오늘의 추천</h2>
      <span class="section__note">내 프로필 적합도 상위 5개</span>
    </div>
    <div class="rail" id="picks"></div>
  </section>

  <section class="section">
    <h2 class="visually-hidden">공고 목록</h2>
    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="controls">
      <div class="search">
        <span aria-hidden="true">⌕</span>
        <input type="search" id="q" placeholder="기업명·직무·기술 키워드 검색 (예: XPS, 리튬메탈, 전해질)" aria-label="통합 검색" />
      </div>
      <select class="select" id="sort" aria-label="정렬">
        <option value="fit">적합도순</option>
        <option value="deadline">마감일순</option>
        <option value="posted">최신순</option>
      </select>
      <select class="select" id="view" aria-label="보기">
        <option value="active">활성 공고</option>
        <option value="saved">관심 공고</option>
        <option value="planned">지원 예정</option>
        <option value="applied">지원 완료</option>
        <option value="hidden">숨긴 공고</option>
        <option value="archived">마감 공고 보관함</option>
      </select>
    </div>

    <div class="pills" id="sizePills" role="group" aria-label="기업 규모 필터"></div>
    <div class="pills" id="miscPills" role="group" aria-label="추가 필터"></div>

    <div class="list" id="list"></div>
  </section>
</main>

<footer class="footer wrap">
  <p id="footNote"></p>
  <p>수집 원칙과 한계는 <a href="./DATA_NOTICE.md">데이터 안내문</a>에 정리되어 있습니다. 공고 본문은 복제하지 않으며 항상 원문 링크를 함께 제공합니다.</p>
</footer>

<dialog id="settingsDlg">
  <form method="dialog">
    <div class="dlg__head"><h2>내 프로필</h2></div>
    <div class="dlg__body">
      <p style="margin-top:0;font-size:13px;color:var(--muted)">
        비워두면 그 항목은 “충족”으로 가정하지 않고 <strong>확인 필요</strong>로 표시합니다. 값은 이 브라우저에만 저장됩니다.
      </p>
      <div class="field">
        <label for="pfDegree">최종 학위</label>
        <select id="pfDegree">
          <option value="">미입력</option>
          <option value="bachelor">학사</option>
          <option value="master">석사</option>
          <option value="phd">박사</option>
        </select>
      </div>
      <div class="field">
        <label for="pfDegreeAt">학위 취득(예정) 시점</label>
        <input type="month" id="pfDegreeAt" />
      </div>
      <div class="field">
        <label for="pfYears">경력(년)</label>
        <input type="number" id="pfYears" min="0" max="40" step="1" placeholder="미입력" />
        <small>인턴·연구원 경력 포함 여부는 공고마다 다르니 원문을 확인하세요.</small>
      </div>
      <div class="field">
        <label for="pfLoc">희망 근무지 (쉼표로 구분)</label>
        <input type="text" id="pfLoc" placeholder="예: 서울, 대전, 수원" />
      </div>
      <div class="field">
        <label for="pfSkills">추가 보유 기술 (쉼표로 구분)</label>
        <input type="text" id="pfSkills" placeholder="예: ToF-SIMS, cryo-TEM, Python" />
      </div>
      <div class="field">
        <label for="pfOverseas">해외 근무 가능 여부</label>
        <select id="pfOverseas">
          <option value="">미입력</option>
          <option value="yes">가능</option>
          <option value="no">불가</option>
        </select>
      </div>
    </div>
    <div class="dlg__foot">
      <button class="btn" value="cancel">취소</button>
      <button class="btn btn--primary" id="pfSave" value="save">저장하고 다시 계산</button>
    </div>
  </form>
</dialog>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
